# Project Configuration for Options Assistant

# Development environment
dev:
  catalog: mlops_dev
  schema: rsreeram
  volume: options_files
  llm_endpoint: databricks-llama-4-maverick
  embedding_endpoint: databricks-gte-large-en
  warehouse_id: 9c9d5a71fb3773e4
  vector_search_endpoint: options_vs_endpoint
  pdf_filename: options_bok.pdf
  experiment_name: /Shared/options-assistant-dev

# Acceptance/Staging environment
acc:
  catalog: mlops_dev
  schema: rsreeram
  volume: options_files
  llm_endpoint: databricks-meta-llama-3-1-70b-instruct
  embedding_endpoint: databricks-gte-large-en
  warehouse_id: 9c9d5a71fb3773e4
  vector_search_endpoint: options_vs_endpoint
  pdf_filename: options_bok.pdf
  experiment_name: /Shared/options-assistant-acc

# Production environment
prd:
  catalog: mlops_dev
  schema: rsreeram
  volume: options_files
  llm_endpoint: databricks-meta-llama-3-1-70b-instruct
  embedding_endpoint: databricks-gte-large-en
  warehouse_id: 9c9d5a71fb3773e4
  vector_search_endpoint: options_vs_endpoint
  pdf_filename: options_bok.pdf
  experiment_name: /Shared/options-assistant-prd

# Model configuration
model_config:
  temperature: 0.7
  max_tokens: 2000
  top_p: 0.95

# Vector search configuration
vector_search:
  embedding_dimension: 1024  # databricks-gte-large-en dimension
  similarity_metric: cosine
  num_results: 5
  enable_hybrid_search: true
  enable_reranking: false

# Chunking configuration
chunking:
  chunk_size: 512
  chunk_overlap: 50
  separator: "\n\n"
